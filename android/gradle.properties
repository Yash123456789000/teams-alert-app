# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure (required by React Native and Firebase).
android.useAndroidX=true

# CPU architectures to build native code for. For faster debug builds on one
# device you can override from the CLI: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture is deliberately DISABLED.
# react-native-callkeep 4.x is an old-style native module and gates its JS event
# delivery on ReactContext.hasActiveCatalystInstance(), which is the least risky
# to rely on with the classic bridge. See README "Design notes".
newArchEnabled=false

# Hermes JS engine.
hermesEnabled=true
